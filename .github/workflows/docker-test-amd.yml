name: docker-test-amd

on:
  schedule: 
    # 6時間おきに起動（0:00, 6:00, 12:00, 18:00）
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: # テストや手動起動用（強く推奨）

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true 

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04 
    # 5時間50分（350分）を超えたらこのワークフロー自体を自動で安全に終了させます。
    timeout-minutes: 350 

    # GHCRへのプッシュに必要な権限を追加
    permissions:
      contents: read
      actions: write
      packages: write

    steps:
      - name: Keep workflow alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          # Enables the current workflow using its runtime reference to prevent 60-day cron suspension
          gh workflow enable "CI-ubuntu.yml" --repo "${{ github.repository }}"

      - name: Delete workflow runs older than 1 day
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          # workflow_id: ${{ github.workflow_ref }}
          retain_days: 1 
          keep_minimum_runs: 0
          delete_run_by_conclusion_pattern: all

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 正確な git describe のために全履歴を取得

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.REPO }} 
          token: ${{ secrets.GH_PAT }} 
          path: .

      - name: Install
        run: |
          set -e
          bash ./ubuntu/install.sh >/dev/null 2>&1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub公式の認証トークン（github.token）を使ってGHCRに自動ログイン
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 動的なアプリのバージョン（git describe）を取得し、環境変数に安全に格納
      - name: Generate App Version
        run: |
          echo "APP_VERSION=$(git describe --tags --always)" >> $GITHUB_ENV

      # Dockerのタグ（大文字小文字の変換を含む）とラベルのメタデータを生成
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.APP_VERSION }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: |
            linux/amd64
          build-args: |
            APP_NAME=${{ env.APP_NAME }}
            APP_VERSION=${{ env.APP_VERSION }}
          # ⭕ メタデータアクションが生成したタグとラベルを正しく適用
          tags: ${{ id.meta.outputs.tags }}
          labels: ${{ id.meta.outputs.labels }}
          # 🚀 ビルド高速化のためにGHAキャッシュを有効化
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test
        env:
          IMAGE_URL:  ghcr.io/${{ github.repository_owner }}/neveridle
          V_SRV: ${{ secrets.V_SRV }}          
          V_KEY: ${{ secrets.V_KEY }}  
          V_HOST: ${{ secrets.V_HOST12 }}  
        run: |
          set -e
          bash ./ubuntu/start.sh >/dev/null 2>&1